<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div>
        <div class="brand">
          <div class="logo">✓</div>
          <div>
            <h1>TaskFlow</h1>
            <p>Stay organized. Get things done.</p>
          </div>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        System Online
      </div>
    </header>

    <main>

      <section class="welcome">
        <div>
          <h2>My Tasks</h2>
          <p>Manage your daily work in one place.</p>
        </div>
      </section>

      <section class="stats">

        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div>
            <span>Total Tasks</span>
            <strong id="total">0</strong>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div>
            <span>Pending</span>
            <strong id="pending">0</strong>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">✓</div>
          <div>
            <span>Completed</span>
            <strong id="completed">0</strong>
          </div>
        </div>

      </section>

      <section class="task-panel">

        <form id="taskForm" class="add-task">
          <input
            id="title"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
            required
          >
          <button type="submit">
            <span>+</span> Add Task
          </button>
        </form>

        <div class="toolbar">
          <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="completed">Completed</button>
          </div>

          <button id="clearCompleted" class="clear-btn">
            Clear completed
          </button>
        </div>

        <div id="tasks" class="tasks"></div>

        <div id="empty" class="empty">
          <div class="empty-icon">🎯</div>
          <h3>No tasks here</h3>
          <p>Add a task above to get started.</p>
        </div>

      </section>

    </main>

    <footer>
      <span>TaskFlow</span>
      <span>•</span>
      <span>Powered by Node.js + MongoDB + Kubernetes</span>
    </footer>

  </div>

  <script src="/app.js"></script>

</body>
</html>
